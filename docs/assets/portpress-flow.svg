		<circle cx="103" cy="78" r="8" fill="#0f766e"/>
		<rect x="42" y="145" width="63" height="58" rx="14" fill="#eff6ff" stroke="#3858e9" stroke-width="6"/>
		<path d="M139 152h70M139 176h48M139 200h60" stroke="#0f766e" stroke-linecap="round" stroke-width="7"/>
		<path d="M43 232H217" stroke="#dbeafe" stroke-linecap="round" stroke-width="13"/>
		<g transform="translate(50 258)">
			<path d="M0 0H175C190 0 202 12 202 27V62H0z" fill="#f8fafc" stroke="#cbd8e2" stroke-width="3"/>
			<rect x="16" y="15" width="16" height="14" rx="3" fill="#eff6ff" stroke="#3858e9" stroke-width="3"/>
