		<animateTransform attributeName="transform" type="translate" dur="7.2s" begin="3.05s" repeatCount="indefinite" values="-76 -4; -76 -4; 34 10; 74 18; 74 18" keyTimes="0; .10; .34; .52; 1" calcMode="spline" keySplines=".45 0 .2 1; .45 0 .2 1; .45 0 .2 1; .45 0 .2 1"/>
		<animate attributeName="opacity" dur="7.2s" begin="3.05s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.08;.2;.54;.64;1"/>
	</g>

	<g transform="translate(784 100)" filter="url(#soft-shadow)">
		<g class="output-stack">
