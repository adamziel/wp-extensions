<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WordPress Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        color: #1d2327;
        background: #f6f7f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.875rem 1rem;
        background: #1d2327;
        color: #fff;
      }

      h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      main {
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      #playground-root {
        width: min(100%, 54rem);
        min-height: 22rem;
        border: 1px solid #c3c4c7;
        background: #fff;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
      }

      .status {
        margin: 0;
        max-width: 42rem;
        color: #3c434a;
      }

      code {
        background: #f0f0f1;
        border-radius: 3px;
        padding: 0.125rem 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WordPress Admin</h1>
      <span>Static/Dynamic Publisher</span>
    </header>
    <main>
      <section
        id="playground-root"
        data-source-manifest="/_static-dynamic-source/manifest.json"
        data-publish-endpoint="/_static-dynamic-api/publish"
      >
        <strong>Playground shell ready</strong>
        <p class="status">
          Preserved WordPress source will load from <code>/_static-dynamic-source/manifest.json</code>.
        </p>
      </section>
    </main>
    <script type="module">
      const root = document.getElementById("playground-root");

      window.StaticDynamicPublisher = {
        sourceManifestUrl: root?.dataset.sourceManifest ?? "/_static-dynamic-source/manifest.json",
        publishEndpoint: root?.dataset.publishEndpoint ?? "/_static-dynamic-api/publish",
      };
    </script>
  </body>
</html>
