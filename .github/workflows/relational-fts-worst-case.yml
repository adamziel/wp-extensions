name: Relational FTS worst-case

on:
  pull_request:
    paths:
      - 'components/full-text-search/src/**'
      - 'components/full-text-search/composer.json'
      - 'components/full-text-search/composer.lock'
      - 'components/full-text-search/resources/**'
      - 'components/full-text-search/tests/**'
      - 'components/full-text-search/tools/**'
      - 'indexer/.distignore'
      - 'indexer/*.php'
      - 'indexer/composer.json'
      - 'indexer/composer.lock'
      - 'indexer/config/**'
      - 'indexer/resources/**'
      - 'indexer/src/**'
      - 'indexer/tests/fixtures/**'
      - 'indexer/tests/integration/**'
      - 'indexer/tests/quality/relational-fts-worst-case-contracts.php'
      - 'indexer/tests/quality/jieba-indexed-multi-run.php'
      - 'indexer/tools/**'
      - 'indexer/docs/relational-search-acceptance.md'
      - '.gitmodules'
      - '.github/workflows/relational-fts-worst-case.yml'

permissions:
  contents: read

concurrency:
  group: relational-fts-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jieba-memory-compatibility:
    name: Jieba memory / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'
          coverage: none
      - name: Install component dependencies
        working-directory: components/full-text-search
        run: composer install --no-interaction --prefer-dist
      - name: Initialize the pinned Jieba source
        run: |
          set -euo pipefail
          components/full-text-search/tools/initialize-jieba-source.sh
          php components/full-text-search/tools/build-jieba-lookup-index.php --check >/dev/null
          php -n components/full-text-search/tools/build-jieba-lookup-index.php --check >/dev/null
      - name: Prove isolated memory under normal and no-ini PHP
        run: |
          set -euo pipefail
          php -l indexer/tests/integration/relational-fts-worst-case.php
          timeout --signal=TERM --kill-after=10s 180s \
            php -d memory_limit=128M indexer/tests/quality/jieba-indexed-multi-run.php \
            > "${{ runner.temp }}/jieba-memory-normal.json"
          timeout --signal=TERM --kill-after=10s 180s \
            php -n -d memory_limit=128M indexer/tests/quality/jieba-indexed-multi-run.php \
            > "${{ runner.temp }}/jieba-memory-no-ini.json"
          timeout --signal=TERM --kill-after=10s 60s \
            php -d memory_limit=128M components/full-text-search/tests/jieba-query-producer-bounds.php \
            > "${{ runner.temp }}/jieba-memory-query-normal.json"
          timeout --signal=TERM --kill-after=10s 60s \
            php -n -d memory_limit=128M components/full-text-search/tests/jieba-query-producer-bounds.php \
            > "${{ runner.temp }}/jieba-memory-query-no-ini.json"
          timeout --signal=TERM --kill-after=10s 180s \
            php -d memory_limit=128M components/full-text-search/tests/smoke.php
          timeout --signal=TERM --kill-after=10s 180s \
            php -n -d memory_limit=128M components/full-text-search/tests/smoke.php
      - name: Upload PHP compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jieba-memory-php-${{ matrix.php-version }}
          path: ${{ runner.temp }}/jieba-memory-*.json
          if-no-files-found: error

  pull-request-50k:
    name: 50k / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        engine:
          - mariadb-10.11
          - mysql-8.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:2.9.8
      - name: Run constrained real-WordPress 50k proof
        timeout-minutes: 345
        run: |
          indexer/tools/run-relational-fts-worst-case.sh \
            --engine='${{ matrix.engine }}' \
            --profile=50k \
            --output=".context/evidence-${{ matrix.engine }}-50k.json"
      - name: Upload evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-fts-${{ matrix.engine }}-50k
          path: .context/evidence-${{ matrix.engine }}-50k.json*
          if-no-files-found: error
          include-hidden-files: true

  pull-request-100k:
    name: 100k / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        engine:
          - mariadb-10.11
          - mysql-8.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:2.9.8
      - name: Install component dependencies
        working-directory: components/full-text-search
        run: composer install --no-interaction --prefer-dist
      - name: Initialize and attest the pinned Jieba source
        env:
          JIEBA_EVIDENCE_DIR: ${{ runner.temp }}/relational-fts-jieba
          JIEBA_PATH: components/full-text-search/resources/sources/jieba
          JIEBA_MANIFEST: components/full-text-search/resources/runtime/jieba/manifest.json
        run: |
          set -euo pipefail
          JIEBA_GITLINK="$(jq -er '.upstream.commit' "${JIEBA_MANIFEST}")"
          JIEBA_URL="$(jq -er '.upstream.repository' "${JIEBA_MANIFEST}")"
          JIEBA_DICTIONARY_PATH="$(jq -er '.upstream.dictionary_path' "${JIEBA_MANIFEST}")"
          JIEBA_DICTIONARY_SHA256="$(jq -er '.artifacts.dictionary.sha256' "${JIEBA_MANIFEST}")"
          JIEBA_DICTIONARY_BYTES="$(jq -er '.artifacts.dictionary.bytes' "${JIEBA_MANIFEST}")"
          JIEBA_LICENSE_PATH="$(jq -er '.upstream.license_path' "${JIEBA_MANIFEST}")"
          JIEBA_LICENSE_SHA256="$(jq -er '.artifacts.license.sha256' "${JIEBA_MANIFEST}")"
          JIEBA_LICENSE_BYTES="$(jq -er '.artifacts.license.bytes' "${JIEBA_MANIFEST}")"
          mkdir -p "${JIEBA_EVIDENCE_DIR}"
          cat > "${JIEBA_EVIDENCE_DIR}/jieba-source-attestation.json" <<JSON
          {"schema":"jieba-source-attestation-v1","status":"RUNNING","path":"${JIEBA_PATH}"}
          JSON

          indexed_entry="$(git ls-files --stage -- "${JIEBA_PATH}")"
          test "$(printf '%s\n' "${indexed_entry}" | grep -c .)" -eq 1
          read -r indexed_mode indexed_gitlink indexed_stage indexed_path <<< "${indexed_entry}"
          test "${indexed_mode}" = 160000
          test "${indexed_stage}" = 0
          test "${indexed_path}" = "${JIEBA_PATH}"
          test "${indexed_gitlink}" = "${JIEBA_GITLINK}"
          test "$(git config -f .gitmodules --get "submodule.${JIEBA_PATH}.path")" = "${JIEBA_PATH}"
          test "$(git config -f .gitmodules --get "submodule.${JIEBA_PATH}.url")" = "${JIEBA_URL}"

          git submodule sync -- "${JIEBA_PATH}"
          git -c protocol.version=2 submodule update --init --depth 1 -- "${JIEBA_PATH}"
          actual_gitlink="$(git -C "${JIEBA_PATH}" rev-parse HEAD)"
          test "${actual_gitlink}" = "${JIEBA_GITLINK}"
          test -z "$(git -C "${JIEBA_PATH}" status --porcelain --untracked-files=all)"

          dictionary="${JIEBA_PATH}/${JIEBA_DICTIONARY_PATH}"
          license="${JIEBA_PATH}/${JIEBA_LICENSE_PATH}"
          dictionary_sha256="$(sha256sum "${dictionary}" | cut -d ' ' -f 1)"
          dictionary_bytes="$(stat -c %s "${dictionary}")"
          license_sha256="$(sha256sum "${license}" | cut -d ' ' -f 1)"
          license_bytes="$(stat -c %s "${license}")"
          test "${dictionary_sha256}" = "${JIEBA_DICTIONARY_SHA256}"
          test "${dictionary_bytes}" = "${JIEBA_DICTIONARY_BYTES}"
          test "${license_sha256}" = "${JIEBA_LICENSE_SHA256}"
          test "${license_bytes}" = "${JIEBA_LICENSE_BYTES}"

          cat > "${JIEBA_EVIDENCE_DIR}/jieba-source-attestation.json" <<JSON
          {
            "schema": "jieba-source-attestation-v1",
            "status": "PASS",
            "path": "${JIEBA_PATH}",
            "url": "${JIEBA_URL}",
            "gitlink": "${actual_gitlink}",
            "dictionary": {"bytes": ${dictionary_bytes}, "sha256": "${dictionary_sha256}"},
            "license": {"bytes": ${license_bytes}, "sha256": "${license_sha256}"}
          }
          JSON
      - name: Prove indexed Jieba multi-run work stays bounded
        env:
          JIEBA_EVIDENCE_DIR: ${{ runner.temp }}/relational-fts-jieba
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 60s \
            php -d memory_limit=128M components/full-text-search/tools/build-jieba-lookup-index.php --check \
            > "${JIEBA_EVIDENCE_DIR}/jieba-lookup-index-check.json"
          evidence="${JIEBA_EVIDENCE_DIR}/jieba-indexed-multi-run.json"
          temporary="${evidence}.tmp"
          time_evidence="${JIEBA_EVIDENCE_DIR}/jieba-indexed-multi-run.time.txt"
          printf '%s\n' '{"status":"RUNNING"}' > "${evidence}"
          /usr/bin/time -v -o "${time_evidence}" \
            timeout --signal=TERM --kill-after=10s 60s \
            php -d memory_limit=128M indexer/tests/quality/jieba-indexed-multi-run.php \
            > "${temporary}"
          php -r '
          $e=json_decode((string)file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $manifest=json_decode((string)file_get_contents($argv[2]),true,32,JSON_THROW_ON_ERROR);
          $dictionary=$manifest["artifacts"]["dictionary"]??[];
          $lookup=$manifest["artifacts"]["lookup"]??[];
          $m=$e["measurements"]??[];$cold=$m["cold"]??[];$saturated=$m["saturated"]??[];
          $wideCold=$m["repeated_wide_cold"]??[];$wideSaturated=$m["repeated_wide_saturated"]??[];
          $permuted=$m["permuted_wide"]??[];$changing=$m["changing_prefix"]??[];
          $distinctSets=$m["distinct_prefix_sets"]??[];$maximum=$m["maximum_distinct"]??[];
          $fanoutRecord=$m["maximum_fanout_record"]??[];$maximumFanout=$m["maximum_fanout"]??[];
          $completeRecord=$m["complete_pinned_cache_record"]??[];$completeCache=$m["complete_pinned_cache"]??[];
          $valid=($e["schema"]??null)==="jieba-indexed-multi-run-v2"
            &&($e["status"]??null)==="pass"
            &&($e["memory_limit"]??null)==="128M"
            &&is_int($e["checks"]??null)&&$e["checks"]>=99
            &&($m["dictionary_bytes"]??null)===($dictionary["bytes"]??null)
            &&($m["lookup_bytes"]??null)===($lookup["bytes"]??null)
            &&($m["lookup_ranges"]??null)===($lookup["ranges"]??null)
            &&($m["distinct_runs"]??null)===256;
          foreach([$cold,$saturated] as $run){
            $valid=$valid&&($run["indexed_range_reads"]??PHP_INT_MAX)<=256
              &&($run["elapsed_seconds"]??INF)<5.0
              &&(($run["php_peak_delta_authoritative"]??false)!==true||($run["php_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
              &&(($run["rss_peak_delta_authoritative"]??false)!==true||max($run["rss_delta_bytes"]??PHP_INT_MAX,$run["rss_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
              &&($run["rss_peak_bytes"]??PHP_INT_MAX)<=134217728
              &&($run["rss_source"]??null)==="linux_proc_status";
          }
          foreach([$wideCold,$wideSaturated] as $run){
            $valid=$valid&&($run["term_count"]??null)===18600
              &&($run["indexed_range_reads"]??PHP_INT_MAX)<=20
              &&($run["elapsed_seconds"]??INF)<2.0
              &&(($run["php_peak_delta_authoritative"]??false)!==true||($run["php_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
              &&(($run["rss_peak_delta_authoritative"]??false)!==true||max($run["rss_delta_bytes"]??PHP_INT_MAX,$run["rss_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
              &&($run["rss_peak_bytes"]??PHP_INT_MAX)<=134217728
              &&($run["rss_source"]??null)==="linux_proc_status";
          }
          $valid=$valid&&($permuted["term_count"]??null)===18600
            &&($permuted["indexed_range_reads"]??PHP_INT_MAX)<=20
            &&($permuted["elapsed_seconds"]??INF)<2.0
            &&(($permuted["php_peak_delta_authoritative"]??false)!==true||($permuted["php_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&(($permuted["rss_peak_delta_authoritative"]??false)!==true||max($permuted["rss_delta_bytes"]??PHP_INT_MAX,$permuted["rss_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&($permuted["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $valid=$valid&&($changing["term_count"]??null)===18600
            &&($changing["indexed_range_reads"]??PHP_INT_MAX)<=350
            &&($changing["elapsed_seconds"]??INF)<2.0
            &&(($changing["php_peak_delta_authoritative"]??false)!==true||($changing["php_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&(($changing["rss_peak_delta_authoritative"]??false)!==true||max($changing["rss_delta_bytes"]??PHP_INT_MAX,$changing["rss_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&($changing["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $valid=$valid&&($distinctSets["term_count"]??null)===18600
            &&($distinctSets["indexed_range_reads"]??PHP_INT_MAX)<=4000
            &&($distinctSets["elapsed_seconds"]??INF)<3.0
            &&(($distinctSets["php_peak_delta_authoritative"]??false)!==true||($distinctSets["php_peak_delta_bytes"]??PHP_INT_MAX)<=41943040)
            &&(($distinctSets["rss_peak_delta_authoritative"]??false)!==true||max($distinctSets["rss_delta_bytes"]??PHP_INT_MAX,$distinctSets["rss_peak_delta_bytes"]??PHP_INT_MAX)<=41943040)
            &&($distinctSets["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $valid=$valid&&($maximum["term_count"]??null)===20000
            &&($maximum["indexed_range_reads"]??null)===0
            &&($maximum["elapsed_seconds"]??INF)<15.0
            &&(($maximum["php_peak_delta_authoritative"]??false)!==true||($maximum["php_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&(($maximum["rss_peak_delta_authoritative"]??false)!==true||max($maximum["rss_delta_bytes"]??PHP_INT_MAX,$maximum["rss_peak_delta_bytes"]??PHP_INT_MAX)<=25165824)
            &&($maximum["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $valid=$valid&&($fanoutRecord["prefix_count"]??null)===1365
            &&($fanoutRecord["candidate_count"]??null)===285075
            &&($fanoutRecord["candidate_bytes"]??null)===2581996
            &&($fanoutRecord["run_bytes"]??null)===4095
            &&($maximumFanout["term_count"]??null)===5454
            &&($maximumFanout["indexed_range_reads"]??PHP_INT_MAX)<=1600
            &&($maximumFanout["elapsed_seconds"]??INF)<5.0
            &&(($maximumFanout["php_peak_delta_authoritative"]??false)!==true||($maximumFanout["php_peak_delta_bytes"]??PHP_INT_MAX)<=67108864)
            &&(($maximumFanout["rss_peak_delta_authoritative"]??false)!==true||max($maximumFanout["rss_delta_bytes"]??PHP_INT_MAX,$maximumFanout["rss_peak_delta_bytes"]??PHP_INT_MAX)<=67108864)
            &&($maximumFanout["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $valid=$valid&&($completeRecord["prefix_count"]??null)===5628
            &&($completeRecord["candidate_count"]??null)===337399
            &&($completeRecord["candidate_bytes"]??null)===3013489
            &&($completeRecord["source_prefix_count"]??null)===5652
            &&($completeRecord["source_candidate_count"]??null)===337461
            &&($completeRecord["source_candidate_bytes"]??null)===3013799
            &&($completeCache["run_count"]??null)===5
            &&($completeCache["term_count"]??0)>0
            &&($completeCache["indexed_range_reads"]??null)===5632
            &&($completeCache["elapsed_seconds"]??INF)<5.0
            &&(($completeCache["php_peak_delta_authoritative"]??false)!==true||($completeCache["php_peak_delta_bytes"]??PHP_INT_MAX)<=67108864)
            &&(($completeCache["rss_peak_delta_authoritative"]??false)!==true||max($completeCache["rss_delta_bytes"]??PHP_INT_MAX,$completeCache["rss_peak_delta_bytes"]??PHP_INT_MAX)<=67108864)
            &&($completeCache["rss_peak_bytes"]??PHP_INT_MAX)<=134217728;
          $parentProcess=$m["parent_process"]??[];
          $valid=$valid
            &&($parentProcess["role"]??null)==="cumulative_multi_workload_diagnostic"
            &&($parentProcess["within_128_mib"]??null)===true
            &&($parentProcess["rss_source"]??null)==="linux_proc_status";
          $fresh=$m["fresh_processes"]??[];
          $identity=static fn(array $run,array $extra=[]):array=>[
            "input_bytes"=>$run["input_bytes"]??null,
            "input_sha256"=>$run["input_sha256"]??null,
            "input_unit_count"=>$run["input_unit_count"]??null,
          ]+$extra;
          $freshCases=[
            "cold_256"=>[$cold,$identity($cold),25165824],
            "saturated_256"=>[$saturated,$identity($saturated),25165824],
            "repeated_wide_cold"=>[$wideCold,$identity($wideCold),25165824],
            "repeated_wide_saturated"=>[$wideSaturated,$identity($wideSaturated),25165824],
            "permuted_wide"=>[$permuted,$identity($permuted),25165824],
            "changing_prefix"=>[$changing,$identity($changing),25165824],
            "distinct_prefix_sets"=>[$distinctSets,$identity($distinctSets),41943040],
            "maximum_distinct"=>[$maximum,$identity($maximum),25165824],
            "maximum_fanout"=>[$maximumFanout,$identity($maximumFanout,$fanoutRecord),67108864],
            "complete_pinned_cache"=>[$completeCache,$identity($completeCache,$completeRecord),67108864],
          ];
          $valid=$valid&&array_keys($fresh)===array_keys($freshCases);
          foreach($freshCases as $caseId=>[$parentRun,$workload,$deltaCeiling]){
            $record=$fresh[$caseId]??[];
            $run=$record["measurement"]??[];
            $process=$record["process"]??[];
            $valid=$valid
              &&($record["schema"]??null)==="jieba-isolated-memory-case-v2"
              &&($record["memory_authority"]??null)==="fresh_process_conservative_peak_attribution"
              &&($record["memory_limit"]??null)==="128M"
              &&($record["workload"]??null)===$workload
              &&($run["php_peak_delta_authoritative"]??null)===true
              &&($run["rss_peak_delta_authoritative"]??null)===true
              &&($run["rss_source"]??null)==="linux_proc_status"
              &&is_int($process["php_peak_bytes"]??null)
              &&$process["php_peak_bytes"]>0
              &&$process["php_peak_bytes"]<=134217728
              &&is_int($process["rss_peak_bytes"]??null)
              &&$process["rss_peak_bytes"]>0
              &&$process["rss_peak_bytes"]<=134217728
              &&($process["rss_source"]??null)==="linux_proc_status"
              &&($run["php_peak_delta_bytes"]??PHP_INT_MAX)<=$deltaCeiling
              &&($run["rss_delta_bytes"]??PHP_INT_MAX)<=$deltaCeiling
              &&($run["rss_peak_delta_bytes"]??PHP_INT_MAX)<=$deltaCeiling;
            foreach(["term_count","indexed_range_reads"] as $field){
              $valid=$valid&&($run[$field]??null)===($parentRun[$field]??null);
            }
            if(array_key_exists("run_count",$parentRun)){
              $valid=$valid&&($run["run_count"]??null)===$parentRun["run_count"];
            }
          }
          if(!$valid){fwrite(STDERR,"Jieba indexed multi-run evidence failed its external schema and ceiling validation.\n");exit(1);}
          ' "${temporary}" components/full-text-search/resources/runtime/jieba/manifest.json
          mv "${temporary}" "${evidence}"
      - name: Run constrained real-WordPress 100k boundary proof
        timeout-minutes: 345
        run: |
          indexer/tools/run-relational-fts-worst-case.sh \
            --engine='${{ matrix.engine }}' \
            --profile=100k \
            --output=".context/evidence-${{ matrix.engine }}-100k.json"
      - name: Collect pre-run evidence after clean-source proof
        if: always()
        env:
          JIEBA_EVIDENCE_DIR: ${{ runner.temp }}/relational-fts-jieba
        run: |
          set -euo pipefail
          if [[ -d "${JIEBA_EVIDENCE_DIR}" ]]; then
            mkdir -p .context
            cp -a "${JIEBA_EVIDENCE_DIR}/." .context/
          fi
      - name: Upload evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-fts-${{ matrix.engine }}-100k
          path: |
            .context/evidence-${{ matrix.engine }}-100k.json*
            .context/jieba-*
          if-no-files-found: error
          include-hidden-files: true
