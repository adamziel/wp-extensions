name: Release Markdown Editor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example markdown-editor-latest or markdown-editor-v0.1.0
        required: true
        type: string
  push:
    tags:
      - 'markdown-editor-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install php-toolkit runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction -d markdown-editor/vendor/php-toolkit

      - name: Build release zip
        run: markdown-editor/tools/build-release-zip.sh

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Markdown Editor runtime package.

          Download and run:

          ```bash
          curl -fsSL https://github.com/adamziel/wp-extensions/releases/download/markdown-editor-latest/wp-markdown-editor.zip -o wp-markdown-editor.zip
          rm -rf wp-markdown-editor
          unzip -q wp-markdown-editor.zip

          npx --yes @wp-playground/cli@latest server \
            --php=8.4 \
            --login \
            --php-extension="$PWD/wp-markdown-editor/markdown-editor/sqlite-markdown-extension/dist/manifest.json" \
            --mount-dir "$PWD/wp-markdown-editor/content" /markdown-root \
            --mount-dir "$PWD/wp-markdown-editor/markdown-editor" /wordpress/wp-content/mu-plugins
          ```
          NOTES

      - name: Move stable release tag
        if: env.RELEASE_TAG == 'markdown-editor-latest'
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/wp-markdown-editor.zip --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/wp-markdown-editor.zip \
              --target "$GITHUB_SHA" \
              --title "Markdown Editor $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
