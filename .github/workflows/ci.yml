name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  language-fts:
    name: Language FTS / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize the pinned Jieba dictionary
        run: |
          set -euo pipefail
          path=components/full-text-search/resources/sources/jieba
          gitlink=67fa2e36e72f69d9134b8a1037b83fbb070b9775
          read -r mode indexed_gitlink stage indexed_path <<< "$(git ls-files --stage -- "${path}")"
          test "${mode}" = 160000
          test "${indexed_gitlink}" = "${gitlink}"
          test "${stage}" = 0
          test "${indexed_path}" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.path")" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.url")" = https://github.com/fxsjy/jieba
          git submodule sync -- "${path}"
          git -c protocol.version=2 submodule update --init --depth 1 -- "${path}"
          test "$(git -C "${path}" rev-parse HEAD)" = "${gitlink}"
          test -z "$(git -C "${path}" status --porcelain --untracked-files=all)"
          test "$(sha256sum "${path}/jieba/dict.txt" | cut -d ' ' -f 1)" = 7197c3211ddd98962b036cdf40324d1ea2bfaa12bd028e68faa70111a88e12a8
          test "$(stat -c %s "${path}/jieba/dict.txt")" = 5071852
          test "$(sha256sum "${path}/LICENSE" | cut -d ' ' -f 1)" = 18ba0984839f85853b29fadaf992f7dba8fd0ca0fbeae34de2b8735222dc7a37
          test "$(stat -c %s "${path}/LICENSE")" = 1075

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Install component dependencies
        working-directory: components/full-text-search
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist

      - name: Test reusable full-text search component
        working-directory: components/full-text-search
        run: |
          timeout --signal=TERM --kill-after=10s 60s php -d memory_limit=128M tools/build-jieba-lookup-index.php --check
          composer test

      - name: Install Language FTS dependencies
        working-directory: indexer
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist

      - name: Test Language FTS plugin
        working-directory: indexer
        env:
          WP_FTS_FAIL_ON_PENDING: '1'
        run: composer test

  language-fts-no-extensions:
    name: Language FTS / PHP ${{ matrix.php }} / no shared extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize the pinned Jieba dictionary
        run: |
          set -euo pipefail
          path=components/full-text-search/resources/sources/jieba
          gitlink=67fa2e36e72f69d9134b8a1037b83fbb070b9775
          read -r mode indexed_gitlink stage indexed_path <<< "$(git ls-files --stage -- "${path}")"
          test "${mode}" = 160000
          test "${indexed_gitlink}" = "${gitlink}"
          test "${stage}" = 0
          test "${indexed_path}" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.path")" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.url")" = https://github.com/fxsjy/jieba
          git submodule sync -- "${path}"
          git -c protocol.version=2 submodule update --init --depth 1 -- "${path}"
          test "$(git -C "${path}" rev-parse HEAD)" = "${gitlink}"
          test -z "$(git -C "${path}" status --porcelain --untracked-files=all)"
          test "$(sha256sum "${path}/jieba/dict.txt" | cut -d ' ' -f 1)" = 7197c3211ddd98962b036cdf40324d1ea2bfaa12bd028e68faa70111a88e12a8
          test "$(stat -c %s "${path}/jieba/dict.txt")" = 5071852
          test "$(sha256sum "${path}/LICENSE" | cut -d ' ' -f 1)" = 18ba0984839f85853b29fadaf992f7dba8fd0ca0fbeae34de2b8735222dc7a37
          test "$(stat -c %s "${path}/LICENSE")" = 1075

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Test source fallbacks without php.ini
        env:
          WP_FTS_FAIL_ON_PENDING: '1'
        run: |
          timeout --signal=TERM --kill-after=10s 60s php -n -d memory_limit=128M components/full-text-search/tools/build-jieba-lookup-index.php --check
          php -n components/full-text-search/tests/smoke.php
          php -n indexer/tests/run.php

  language-fts-release:
    name: Language FTS / release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize the pinned Jieba dictionary
        run: |
          set -euo pipefail
          path=components/full-text-search/resources/sources/jieba
          gitlink=67fa2e36e72f69d9134b8a1037b83fbb070b9775
          read -r mode indexed_gitlink stage indexed_path <<< "$(git ls-files --stage -- "${path}")"
          test "${mode}" = 160000
          test "${indexed_gitlink}" = "${gitlink}"
          test "${stage}" = 0
          test "${indexed_path}" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.path")" = "${path}"
          test "$(git config -f .gitmodules --get "submodule.${path}.url")" = https://github.com/fxsjy/jieba
          git submodule sync -- "${path}"
          git -c protocol.version=2 submodule update --init --depth 1 -- "${path}"
          test "$(git -C "${path}" rev-parse HEAD)" = "${gitlink}"
          test -z "$(git -C "${path}" status --porcelain --untracked-files=all)"
          test "$(sha256sum "${path}/jieba/dict.txt" | cut -d ' ' -f 1)" = 7197c3211ddd98962b036cdf40324d1ea2bfaa12bd028e68faa70111a88e12a8
          test "$(stat -c %s "${path}/jieba/dict.txt")" = 5071852
          test "$(sha256sum "${path}/LICENSE" | cut -d ' ' -f 1)" = 18ba0984839f85853b29fadaf992f7dba8fd0ca0fbeae34de2b8735222dc7a37
          test "$(stat -c %s "${path}/LICENSE")" = 1075

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Lint Language FTS PHP
        run: |
          find components/full-text-search indexer \
            -path '*/vendor' -prune -o \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate every bundled analyzer pack
        run: |
          while IFS= read -r -d '' manifest; do
            php indexer/tools/validate-analyzer-pack.php "$manifest"
          done < <(find indexer/resources/analyzer-packs -name manifest.json -print0)

      - name: Build and bootstrap the direct-install artifact
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          php indexer/tools/check-release-readiness.php \
            --target=direct-install \
            --build-dir="$workdir/build" \
            --output="$workdir/wp-fts-indexer.zip" \
            > "$workdir/readiness.json"
          php -r '
            $report = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($report["status"] ?? null) !== "ready" || ($report["target"] ?? null) !== "direct-install") {
                fwrite(STDERR, "Direct-install readiness did not pass.\n");
                exit(1);
            }
          ' "$workdir/readiness.json"

          unzip -t "$workdir/wp-fts-indexer.zip"
          unzip -q "$workdir/wp-fts-indexer.zip" -d "$workdir/plugins"
          test -f "$workdir/plugins/indexer/indexer.php"
          test -f "$workdir/plugins/indexer/vendor/autoload.php"
          test -f "$workdir/plugins/indexer/vendor/wp-php-toolkit/full-text-search/src/bootstrap.php"
          test ! -e "$workdir/plugins/components/full-text-search"
          php -r '
            $plugin = $argv[1];
            define("ABSPATH", $plugin . "/");
            require $plugin . "/indexer.php";
            if (!class_exists("WP_FTS_Analyzer", false) || !class_exists("WP_FTS_Plugin", false)) {
                fwrite(STDERR, "Packaged Language FTS runtime did not bootstrap.\n");
                exit(1);
            }
          ' "$workdir/plugins/indexer"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Validate Blueprint JSON
        run: |
          php -r 'foreach (glob("blueprints/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "Valid $file\n"; }'
          php tests/static-site-generator-blueprint-test.php
          php tests/docs-site-test.php

      - name: Check Static Site Generator
        run: |
          umask 0022
          find static-site-generator -name '*.php' -print0 | xargs -0 -n1 php -l
          php static-site-generator/tests/path-utils-test.php
          php static-site-generator/tests/url-collector-test.php
          php static-site-generator/tests/url-rewriter-test.php
          php static-site-generator/tests/static-exporter-test.php
          php static-site-generator/tests/plugin-test.php

      - name: Check Markdown Editor release package
        run: |
          umask 0022
          bash -n markdown-editor/run-playground-cli.sh
          bash -n markdown-editor/tools/build-release-zip.sh
          git submodule update --init --recursive markdown-editor/vendor/php-toolkit
          composer install --no-dev --prefer-dist --no-interaction -d markdown-editor/vendor/php-toolkit
          php tests/markdown-editor-conversion-test.php
          markdown-editor/tools/build-release-zip.sh
          unzip -l dist/wp-markdown-editor.zip | grep 'wp-markdown-editor/run-playground-cli.sh'
          unzip -l dist/wp-markdown-editor.zip | grep 'wp-markdown-editor/markdown-editor/vendor/php-toolkit/vendor/autoload.php'
          unzip -l dist/wp-markdown-editor.zip | grep 'wp-markdown-editor/markdown-editor/sqlite-markdown-extension/dist/manifest.json'

      - name: Install Universal Importer dependencies
        working-directory: universal-wordpress-importer
        run: composer install --no-interaction --prefer-dist

      - name: Test Universal Importer
        working-directory: universal-wordpress-importer
        env:
          UNIVERSAL_IMPORTER_SKIP_CHROMIUM_TEST: '1'
        run: |
          umask 0022
          composer validate --no-check-publish
          php ../tests/markdown-docs-static-export-test.php
          composer test
          composer lint
          composer build:release
